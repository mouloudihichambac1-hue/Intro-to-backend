<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Digital Absence - Accueil</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-bg">
    <div class="overlay">
        <header class="main-header">
            <img src="images/abslogo.png" alt="Logo" class="logo">
             <h1>Bienvenue dans la communauté Digital Absence</h1>
        </header>

        <section class="hero-section">
            <p>Le site pour gérer les présences et les absences en un clic.</p>
        </section>

        <div class="role-container">
            <div class="role-card" onclick="goToLogin('admin')">
                <div class="role-icon">🏛️</div>
                <h3>Administration</h3>
                <button class="moodle-btn">Accéder</button>
            </div>
            <div class="role-card" onclick="goToLogin('prof')">
                <div class="role-icon">👨‍🏫</div>
                <h3>Professeurs</h3>
                <button class="moodle-btn">Accéder</button>
            </div>
            <div class="role-card" onclick="goToLogin('student')">
                <div class="role-icon">🎓</div>
                <h3>Étudiants</h3>
                <button class="moodle-btn">Accéder</button>
            </div>
        </div>
    </div>
    <script>
        function goToLogin(role) {
            window.location.href = `login.html?role=${role}`;
        }
    </script>
</body>
</html>
