<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - AbsenceDigit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="mb-8 text-indigo-900 flex items-center gap-2 text-3xl font-bold">
        <i class="fas fa-fingerprint text-indigo-600"></i> AbsenceDigit
    </div>

    <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-md border border-gray-100">
        <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-2">Bienvenue !</h2>
        <p class="text-center text-gray-500 mb-8">Choisissez votre profil pour créer un compte</p>

        <div class="flex p-1 bg-gray-100 rounded-xl mb-8">
            <button id="btn-prof" onclick="toggleForm('prof')" class="flex-1 py-2 rounded-lg font-bold transition bg-white text-indigo-600 shadow-sm">
                Professeur
            </button>
            <button id="btn-student" onclick="toggleForm('student')" class="flex-1 py-2 rounded-lg font-bold transition text-gray-500">
                Étudiant
            </button>
        </div>

        <form id="form-prof" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nom du Professeur</label>
                <input type="text" placeholder="Ex: Dr. Ahmed" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Matière</label>
                <input type="text" placeholder="Ex: Intelligence Artificielle" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-indigo-700 transition">
                Créer mon compte Professeur
            </button>
        </form>

        <form id="form-student" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nom de l'Étudiant</label>
                <input type="text" placeholder="Ex: Sara Mansouri" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Identifiant (ID)</label>
                <input type="text" placeholder="Ex: ETU-2026-99" class="w-full p-3 border border-gray-300 rounded-lg font-mono focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-700 transition">
                Créer mon compte Étudiant
            </button>
        </form>
    </div>

    <div class="mt-8 bg-white p-4 rounded-xl shadow border border-gray-100 w-full max-w-md text-center">
        <p class="text-gray-600">Vous avez déjà un compte ? <a href="#" class="text-indigo-600 font-bold hover:underline">Se connecter</a></p>
    </div>

    <script>
        function toggleForm(role) {
            const fProf = document.getElementById('form-prof');
            const fStudent = document.getElementById('form-student');
            const bProf = document.getElementById('btn-prof');
            const bStudent = document.getElementById('btn-student');

            if(role === 'prof') {
                fProf.classList.remove('hidden');
                fStudent.classList.add('hidden');
                bProf.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                bStudent.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                bStudent.classList.add('text-gray-500');
            } else {
                fProf.classList.add('hidden');
                fStudent.classList.remove('hidden');
                bStudent.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                bProf.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                bProf.classList.add('text-gray-500');
            }
        }
    </script>
</body>
</html>
