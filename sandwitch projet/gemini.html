<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste d'ingrédients</title>
    <style>
        /* Un peu de style pour la lisibilité */
        body { font-family: sans-serif; padding: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f0f0f0; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; }
        button.delete-btn { background: #ff4d4d; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Ma Liste de Courses</h2>

    <input type="text" id="inputIngredient" placeholder="Pommes, Farine...">
    <button onclick="ajouterIngredient()">Ajouter</button>

    <ul id="listeIngredients"></ul>

    <script>
        function ajouterIngredient() {
            // 1. Récupérer la valeur de l'input
            const input = document.getElementById("inputIngredient");
            const valeur = input.value;

            // Sécurité : ne rien faire si le champ est vide
            if (valeur === "") {
                alert("Veuillez écrire un ingrédient !");
                return;
            }

            // 2. Créer l'élément de liste (li)
            const nouvelIngredient = document.createElement("li");
            
            // Ajouter le texte de l'ingrédient
            const texte = document.createElement("span");
            texte.textContent = valeur;
            
            // 3. Créer le bouton de suppression
            const boutonSupprimer = document.createElement("button");
            boutonSupprimer.textContent = "X";
            boutonSupprimer.className = "delete-btn";

            // AJOUTER L'ÉVÉNEMENT DE SUPPRESSION
            boutonSupprimer.onclick = function() {
                // 'this' est le bouton, 'parentElement' est le <li>
                this.parentElement.remove();
            };

            // Assembler le tout : mettre le texte et le bouton dans le li
            nouvelIngredient.appendChild(texte);
            nouvelIngredient.appendChild(boutonSupprimer);

            // 4. Ajouter le li final à la liste (ul)
            const liste = document.getElementById("listeIngredients");
            liste.appendChild(nouvelIngredient);

            // 5. Vider le champ input pour le prochain ingrédient
            input.value = "";
        }
    </script>
</body>
</html>
